<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Generator Stereo & Binaural</title>
<style>
*{box-sizing:border-box;font-family:-apple-system,sans-serif}body{margin:0;padding:8px;background:#0b1120;color:#f8fafc;display:flex;justify-content:center}
.box{width:100%;max-width:460px;background:#1e293b;border-radius:16px;padding:12px}h1{font-size:1.1rem;text-align:center;margin:0 0 8px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px}
.tab{background:#0f172a;color:#94a3b8;border:1px solid #334155;padding:7px 4px;border-radius:8px;font-weight:700;font-size:.78rem}
.tab.active{background:#38bdf8;color:#0f172a;border-color:#38bdf8}
.card{background:#0f172a;border:1px solid #334155;border-radius:10px;padding:9px;margin-bottom:8px}
.top{display:flex;justify-content:space-between;font-size:.78rem;color:#94a3b8;margin-bottom:6px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}.r{display:flex;align-items:center;gap:5px;background:#1e293b;padding:6px 8px;border-radius:7px;border:1px solid #334155;font-size:.78rem}
.r:has(input:checked){border-color:#38bdf8;background:rgba(56,189,248,.15)}.full{grid-column:span 2}
.swap-row{margin-top:6px;padding-top:6px;border-top:1px solid #334155;display:flex;justify-content:space-between;align-items:center;font-size:.78rem}
.swap-btn{background:#1e293b;color:#f8fafc;border:1px solid #334155;padding:4px 9px;border-radius:7px;font-weight:600;font-size:.75rem}
.swap-btn.on{background:#a855f7;border-color:#a855f7;color:#fff}
.org{background:#1e293b;color:#f8fafc;border:1px solid #334155;padding:6px 8px;border-radius:7px;font-size:.78rem;font-weight:600;text-align:left}
.org span{display:block;font-size:.68rem;color:#38bdf8;font-weight:400}.org.sel{border-color:#38bdf8;background:rgba(56,189,248,.15)}
.info-item{background:#1e293b;border-left:3px solid #38bdf8;padding:6px 8px;border-radius:6px;margin-bottom:5px;font-size:.75rem;line-height:1.35}
.info-item b{color:#38bdf8}
.chL{border-left:4px solid #38bdf8}.chR{border-left:4px solid #a855f7}.row{display:flex;justify-content:space-between;align-items:center;font-size:.9rem}
input[type=number]{width:90px;background:#1e293b;color:#fff;border:1px solid #334155;border-radius:6px;padding:3px 6px;font-size:.95rem;font-weight:700;text-align:right}
input[type=range]{width:100%;margin:5px 0;accent-color:#38bdf8}.chR input[type=range]{accent-color:#a855f7}
.btns{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}.btns button,.w{background:#1e293b;color:#fff;border:1px solid #334155;padding:5px 2px;border-radius:6px;font-size:.73rem;font-weight:600}
.waves{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:7px}.w.on{background:#38bdf8;color:#0f172a}
.play{width:100%;padding:11px;border:0;border-radius:10px;font-size:.95rem;font-weight:700;background:#38bdf8;color:#0f172a}.play.stop{background:#ef4444;color:#fff}
#st{font-size:.72rem;color:#94a3b8;text-align:center;margin-top:6px}
</style>
</head>
<body>
<div class="box">
<h1>Generator Stereo & Binaural</h1>
<div class="tabs">
<button type="button" class="tab active" id="tb1" onclick="showTab(1)">Mod Binaural</button>
<button type="button" class="tab" id="tb2" onclick="showTab(2)">Organe</button>
<button type="button" class="tab" id="tb3" onclick="showTab(3)">Ghid Unde</button>
</div>
<div class="card" id="p1">
<!-- Interfața pentru Sincronizare, Bază Optimă și opțiuni de alternare L/R -->
</div>

<div class="card" id="p2" style="display:none">
<!-- Selecția presetărilor pentru organe și frecvențele asociate -->
</div>

<div class="card" id="p3" style="display:none">
<!-- Ghidul pentru undele cerebrale (Delta, Theta, Alpha, Beta, Gamma) -->
</div>

<div class="card chL">
<!-- Controale pentru canalul Stânga (L) -->
</div>

<div class="card chR">
<!-- Controale pentru canalul Dreapta (R) -->
</div>

<div class="card">
<!-- Selector de forme de undă (Sinus, Pătrat, Triunghi, Ferăstrău) și volum -->
</div>

<button type="button" class="play" id="pb" onclick="tg()">PORNEȘTE AUDIO STEREO</button>
<div id="st">Stare audio: Oprit • v8</div>
</div>
<script>
const MODES={none:{off:null,base:null},equal:{off:0,base:null},delta:{off:2,base:120},theta:{off:6,base:150},alpha:{off:10,base:200},beta:{off:20,base:260},gamma:{off:40,base:320}};
let fL=200,fR=200,le='L',wv='sine',on=0,ctx,oL,oR,g,el,swapOn=false,swapSec=20,swapTimer=null;
const inL=document.getElementById('inL'),slL=document.getElementById('slL'),inR=document.getElementById('inR'),slR=document.getElementById('slR');
const df=document.getElementById('df'),vd=document.getElementById('vd'),vs=document.getElementById('vs'),pb=document.getElementById('pb');
const cl=v=>Math.round(Math.min(20000,Math.max(0,parseFloat(v)||0))*10)/10;
const gm=()=>document.querySelector('input[name="m"]:checked').value;
function showTab(n){[1,2,3].forEach(i=>{document.getElementById('p'+i).style.display=n===i?'block':'none';document.getElementById('tb'+i).classList.toggle('active',n===i);});}
function setOrg(name,hz,btn){document.querySelectorAll('.org').forEach(b=>b.classList.remove('sel'));btn.classList.add('sel');document.getElementById('orgLbl').textContent=name+': '+hz+' Hz';document.querySelector('input[name="m"][value="equal"]').checked=true;fL=fR=cl(hz);le='L';up('');}
function setL(v,t){le='L';fL=cl(v);let o=MODES[gm()].off;if(o!==null)fR=cl(fL+o);up(t?'L':'')}
function setR(v,t){le='R';fR=cl(v);let o=MODES[gm()].off;if(o!==null)fL=cl(fR+o);up(t?'R':'')}
function cm(){let m=MODES[gm()];if(m.base!==null){fL=m.base;fR=cl(m.base+m.off);le='L';}else if(m.off!==null){if(le==='L')fR=cl(fL+m.off);else fL=cl(fR+m.off);}up('');}
function toggleSwap(){swapOn=!swapOn;const btn=document.getElementById('swBtn'),lbl=document.getElementById('swLbl');if(swapOn){btn.textContent='Oprește 20s';btn.classList.add('on');swapSec=20;lbl.textContent='Alternare L ↔ R: în 20s';swapTimer=setInterval(()=>{swapSec--;if(swapSec<=0){let tmp=fL;fL=fR;fR=tmp;up('');swapSec=20;}lbl.textContent='Alternare L ↔ R: în '+swapSec+'s';},1000);}else{clearInterval(swapTimer);btn.textContent='Activează 20s';btn.classList.remove('on');lbl.textContent='Alternare L ↔ R (20s): Oprit';}}
function up(s){if(s!=='L')inL.value=fL;slL.value=fL;if(s!=='R')inR.value=fR;slR.value=fR;df.textContent='Diferență: '+Math.round(Math.abs(fL-fR)*10)/10+' Hz';if(on&&ctx){oL.frequency.value=fL;oR.frequency.value=fR}}
function sw(t,b){wv=t;document.querySelectorAll('.w').forEach(x=>x.classList.remove('on'));b.classList.add('on');if(oL)oL.type=oR.type=t}
function sv(v){vd.textContent=v+'%';if(g)g.gain.value=v/100}
function tg(){if(!on){try{if(!el){el=document.createElement('audio');el.setAttribute('playsinline','');el.loop=true;el.src='data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';}el.play().catch(()=>{});}catch(e){}const AC=window.AudioContext||window.webkitAudioContext;if(!ctx)ctx=new AC();if(ctx.state!=='running')ctx.resume();oL=ctx.createOscillator();oR=ctx.createOscillator();let pL=ctx.createStereoPanner(),pR=ctx.createStereoPanner();g=ctx.createGain();oL.type=oR.type=wv;oL.frequency.value=fL;oR.frequency.value=fR;pL.pan.value=-1;pR.pan.value=1;g.gain.value=vs.value/100;oL.connect(pL);oR.connect(pR);pL.connect(g);pR.connect(g);g.connect(ctx.destination);oL.start(0);oR.start(0);on=1;pb.textContent='OPREȘTE AUDIO';pb.classList.add('stop');document.getElementById('st').textContent='Stare audio: '+ctx.state+' • v8';}else{oL.stop();oR.stop();if(el)el.pause();on=0;pb.textContent='PORNEȘTE AUDIO STEREO';pb.classList.remove('stop');document.getElementById('st').textContent='Stare audio: Oprit • v8';}}
</script>
</body>
</html>
